name: 功能建议
description: 想要新功能或改进现有行为
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: 你希望解决什么问题
      description: 先描述场景，再说方案；方案不是必须的。
      placeholder: 例如：想让不同通话软件用不同声纹，现在只能全局一个。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法（可选）
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及部分
      options:
        - 音频管线 / 延迟
        - 目标说话人锁定 / 声纹
        - 设备与驱动（含 VB-CABLE）
        - 界面与交互
        - 打包与安装
        - 其他
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息（可选）
      description: 截图、参考实现、你的硬件环境等
    validations:
      required: false
